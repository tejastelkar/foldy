name: Foldy
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
targets:
  Foldy:
    type: application
    platform: macOS
    sources:
      - path: Foldy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foldy.app
        PRODUCT_NAME: Foldy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Foldy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Foldy captures your desktop only while rendering the fold effect. Frames stay on your Mac and are never saved.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Foldy/Foldy.entitlements
  FoldyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FoldyTests
    dependencies:
      - target: Foldy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foldy.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Foldy:
    build:
      targets:
        Foldy: all
        FoldyTests: [test]
    test:
      targets:
        - FoldyTests
